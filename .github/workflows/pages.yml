name: Build and deploy Astro product page

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Check rendered links and stale output
        run: npm run check-links
      - name: Check Astro diagnostics
        run: npm run lint
      - name: Verify Astro output
        run: |
          test -f dist/index.html
          test -f dist/getting-started.html
          test -f dist/reference.html
          test -f dist/limitations.html
          test -f dist/tutorials/quickstart-reachability.html
          test -f dist/status.html
          test -f dist/getting-started/installation.html
          test -f dist/concepts/shortcut-sets.html
          test -f dist/guides/benchmarking.html
          test -f dist/reference/graphs.html
          test -f dist/research/provenance.html
          test -f dist/favicon.svg
          test -f dist/logo.svg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
