name: Usage question
description: Ask for help using a supported reachq API.
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Please include the smallest reproducible example you can.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, OS, and the reachq commit or version.
    validations:
      required: true
